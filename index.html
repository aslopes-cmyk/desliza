<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desliza">
  <meta name="application-name" content="Desliza">

  <title>Desliza · quebra-cabeça de blocos deslizantes</title>
  <meta name="description" content="Deslize as peças e leve o bloco laranja até a saída. 400 fases em 4 dificuldades, modo Aprender e modo Desafio. Grátis, no navegador e offline.">
  <link rel="canonical" href="https://desliza.vercel.app/">

  <!-- compartilhamento (WhatsApp, Facebook, LinkedIn, Instagram) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Desliza">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://desliza.vercel.app/">
  <meta property="og:title" content="Desliza · quebra-cabeça de blocos deslizantes">
  <meta property="og:description" content="Deslize as peças e leve o bloco laranja até a saída. 400 fases, do fácil ao ultra. Grátis no navegador.">
  <meta property="og:image" content="https://desliza.vercel.app/img/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Desliza ao lado de um tabuleiro com blocos coloridos e o bloco laranja preso no meio">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Desliza · quebra-cabeça de blocos deslizantes">
  <meta name="twitter:description" content="Deslize as peças e leve o bloco laranja até a saída. 400 fases, do fácil ao ultra.">
  <meta name="twitter:image" content="https://desliza.vercel.app/img/og-image.jpg">
  <meta name="twitter:image:alt" content="Logo do Desliza ao lado de um tabuleiro com blocos coloridos">

  <!-- dados estruturados para buscadores -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Desliza",
    "description": "Quebra-cabeça de blocos deslizantes com 400 fases em 4 dificuldades, modo Aprender e modo Desafio.",
    "url": "https://desliza.vercel.app/",
    "image": "https://desliza.vercel.app/img/og-image.jpg",
    "inLanguage": "pt-BR",
    "genre": ["Quebra-cabeça", "Lógica"],
    "gamePlatform": "Navegador web",
    "applicationCategory": "Game",
    "operatingSystem": "Qualquer (navegador)",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
  }
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="device" id="device">
    <header class="top">
      <div class="screen" id="screen" title="Toque para ver as fases" data-i18n-title="screenTitle">
        <canvas id="lcd" aria-label="Visor" data-i18n-aria="lcdAria"></canvas>
      </div>
      <div class="keys">
        <button class="key" id="kPrev" aria-label="Fase anterior. Segure para o modo Aprender" data-i18n-aria="kPrevAria">
          <span class="cap">◀</span><span class="lbl"><span data-i18n="kPrev">ANT</span><small data-i18n="kPrevHold">segure: aprender</small></span>
        </button>
        <button class="key" id="kNext" aria-label="Próxima fase. Segure para o modo Desafio" data-i18n-aria="kNextAria">
          <span class="cap">▶</span><span class="lbl"><span data-i18n="kNext">PRÓX</span><small data-i18n="kNextHold">segure: desafio</small></span>
        </button>
        <button class="key" id="kUndo" aria-label="Desfazer. Segure para reiniciar" data-i18n-aria="kUndoAria">
          <span class="cap">↶</span><span class="lbl"><span data-i18n="kUndo">VOLTA</span><small data-i18n="kUndoHold">segure: reiniciar</small></span>
        </button>
        <button class="key key-main" id="kMenu" aria-label="Menu" data-i18n-aria="menu">
          <span class="cap">●</span><span class="lbl"><span data-i18n="kMenu">MENU</span><small>&nbsp;</small></span>
        </button>
      </div>
    </header>

    <section class="board-area" id="boardArea">
      <div class="status"><span class="tip" id="tip" data-i18n="tipStart">Leve o bloco laranja até a saída</span></div>
      <div class="frame" id="frame">
        <div class="board" id="board"></div>
        <div class="exit" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </section>

    <!-- tela inicial -->
    <section class="home" id="home" aria-label="Tela inicial">
      <div class="home-hero">
        <h1 class="title" aria-label="Desliza">
          <span class="tl-d" style="--d:0">D</span><span class="tl-v" style="--d:1">E</span><span class="tl-d" style="--d:2">S</span><span class="tl-v" style="--d:3">L</span><span class="tl-d" style="--d:4">I</span><span class="tl-v" style="--d:5">Z</span><span class="tl-b" style="--d:6">A</span>
        </h1>
        <p class="subtitle" data-i18n="subtitle">o quebra-cabeça de blocos deslizantes</p>
      </div>

      <div class="demo-wrap" aria-hidden="true">
        <div class="demo" id="demo"><div class="demo-exit"></div></div>
      </div>

      <div class="home-menu">
        <button class="play" id="hPlay">
          <span class="play-t" id="hPlayT">JOGAR</span>
          <span class="play-s" id="hPlayS">Fácil · fase 1</span>
        </button>

        <div class="h-label" data-i18n="difficulty">Dificuldade</div>
        <div class="h-diff" id="hDiff"></div>

        <div class="h-label" data-i18n="mode">Modo</div>
        <div class="seg h-mode" id="hMode"></div>

        <div class="h-links">
          <button data-home="levels"><b>▦</b><span data-i18n="levels">Fases</span></button>
          <button data-home="help"><b>?</b><span data-i18n="howTo">Como jogar</span></button>
          <button data-home="about"><b>i</b><span data-i18n="about">Sobre</span></button>
          <button data-home="sound" id="hSound"><b>♪</b><span data-i18n="sound">Som</span></button>
        </div>
      </div>
      <footer class="h-foot"><span data-i18n="homeFoot">v1.0 · projeto pessoal</span><span class="h-lang" id="hLang"></span></footer>
    </section>

    <footer class="brand">
      <span class="logo">DESLIZA</span>
      <button class="mute" id="mute" aria-label="Som" data-i18n-aria="sound">♪</button>
    </footer>
  </main>

  <!-- folha inferior genérica (menu, níveis, ajuda, resultado) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="js/solver.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/display.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
